<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="0.5" stop-color="#2ee6a6"/>
      <stop offset="1" stop-color="#3aa0ff"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fe8c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6a6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ee6a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3aa0ff"/>
    </marker>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- ouroboros ring -->
  <g transform="translate(230 200)">
    <circle r="150" fill="url(#glow)"/>
    <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="22"/>
    <path d="M 0 -118 A 118 118 0 1 1 -40 -111" fill="none" stroke="url(#snake)" stroke-width="14"
          stroke-linecap="round" marker-end="url(#head)"/>
    <!-- generation nodes -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">
      <circle cx="0" cy="-118" r="22" fill="#05070d" stroke="#76b900" stroke-width="3"/>
      <text x="0" y="-113" fill="#76b900">G0</text>
      <circle cx="102" cy="59" r="22" fill="#05070d" stroke="#2ee6a6" stroke-width="3"/>
      <text x="102" y="64" fill="#2ee6a6">G1</text>
      <circle cx="-102" cy="59" r="22" fill="#05070d" stroke="#3aa0ff" stroke-width="3"/>
      <text x="-102" y="64" fill="#3aa0ff">G2</text>
    </g>
    <!-- gate in the middle -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
      <rect x="-46" y="-26" width="92" height="52" rx="10" fill="#0d1424" stroke="#ffffff" stroke-opacity="0.25"/>
      <text y="-4" font-size="12" fill="#9aa4b2">GATE</text>
      <text y="15" font-size="14" font-weight="700" fill="#2ee6a6">CI &gt; 0 ✓</text>
    </g>
  </g>

  <!-- text -->
  <g font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="440" y="168" font-size="84" font-weight="800" letter-spacing="6" fill="url(#title)">OUROBOROS</text>
    <text x="444" y="218" font-size="28" fill="#c9d1d9">An agent team that trains its own next brain.</text>
    <text x="444" y="256" font-size="20" fill="#8b949e">Rewrites its weights, not just its prompts. A jury it can't bribe decides what survives.</text>
  </g>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <rect x="444" y="292" width="168" height="34" rx="17" fill="#76b900" fill-opacity="0.12" stroke="#76b900" stroke-opacity="0.6"/>
    <text x="528" y="314" text-anchor="middle" fill="#a6e05a">NVIDIA Nemotron</text>
    <rect x="624" y="292" width="226" height="34" rx="17" fill="#3aa0ff" fill-opacity="0.12" stroke="#3aa0ff" stroke-opacity="0.6"/>
    <text x="737" y="314" text-anchor="middle" fill="#8cc8ff">Crusoe Managed Inference</text>
    <rect x="862" y="292" width="140" height="34" rx="17" fill="#2ee6a6" fill-opacity="0.12" stroke="#2ee6a6" stroke-opacity="0.6"/>
    <text x="932" y="314" text-anchor="middle" fill="#8ff0cb">8× A100 80GB</text>
    <rect x="1014" y="292" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="1080" y="314" text-anchor="middle" fill="#c9d1d9">Version N+1</text>
  </g>

  <text x="1240" y="376" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#6e7681">Recursive Agents Hackathon · Crusoe × Cerebral Valley · SF · Oct 17 2026</text>
</svg>
