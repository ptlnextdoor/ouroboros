    <rect x="160" y="290" width="200" height="56" rx="8" fill="#0b0f17" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="172" y="310" fill="#8a94a3">referee · HIDDEN side load</text>
    <text x="172" y="332" fill="#ff5f6d" font-weight="700">v1 ✗ 310 MPa</text><text x="268" y="332" fill="#2ee6a6" font-weight="700">v2 ✓ 61 MPa</text>
  </g>
  <g font-family="-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <text x="450" y="170" font-size="96" font-weight="800" letter-spacing="10" fill="url(#title)">FORGE</text>
    <text x="456" y="218" font-size="27" fill="#c9d1d9">Agents that design real parts, and get better on parts they've never seen.</text>
    <text x="456" y="254" font-size="19" fill="#8b949e">Every claim checked by physics they can't fool. Only lessons that survive held-out tests are kept.</text>
  </g>
