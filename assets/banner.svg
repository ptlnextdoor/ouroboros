    <rect x="456" y="288" width="168" height="34" rx="17" fill="#76b900" fill-opacity=".12" stroke="#76b900" stroke-opacity=".6"/><text x="540" y="310" text-anchor="middle" fill="#a6e05a">NVIDIA Nemotron</text>
    <rect x="636" y="288" width="226" height="34" rx="17" fill="#3aa0ff" fill-opacity=".12" stroke="#3aa0ff" stroke-opacity=".6"/><text x="749" y="310" text-anchor="middle" fill="#8cc8ff">Crusoe Managed Inference</text>
