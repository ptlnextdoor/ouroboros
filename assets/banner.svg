  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/><rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="220" cy="200" r="190" fill="url(#glow)"/>
  <!-- wall -->
  <rect x="60" y="60" width="34" height="280" fill="url(#hatch)"/><rect x="92" y="60" width="4" height="280" fill="#566070"/>
  <!-- v1 ghost (failed) -->
  <g opacity=".35"><path d="M96 120h14v130h-14z M110 120h230v14h-230z" fill="#ff5f6d"/></g>
  <!-- v2 bracket -->
  <path d="M96 110h20v170h-20z" fill="url(#ok)"/>
  <path d="M116 110h250v20h-250z" fill="url(#stress)" opacity=".95"/>
  <path d="M116 130 L250 130 L116 250 Z" fill="url(#ok)" opacity=".9"/>
  <circle cx="106" cy="160" r="4" fill="#05070d"/><circle cx="106" cy="240" r="4" fill="#05070d"/>
  <rect x="320" y="62" width="50" height="46" rx="6" fill="#1b2230" stroke="#4aa8ff" stroke-width="1.5"/>
  <path d="M345 140v46" stroke="#ff5f6d" stroke-width="3"/><path d="M337 180l8 12 8-12z" fill="#ff5f6d"/>
