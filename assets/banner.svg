    <rect x="1058" y="288" width="132" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".3"/><text x="1124" y="310" text-anchor="middle" fill="#c9d1d9">Version N+1</text>
  </g>
  <text x="1240" y="376" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#6e7681">Recursive Agents Hackathon · Crusoe × Cerebral Valley · SF · Oct 17 2026</text>
